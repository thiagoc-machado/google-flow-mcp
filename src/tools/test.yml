name: home-server

x-common-env: &common-env
  PUID: '1000'
  PGID: '1000'
  TZ: Europe/Madrid

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: '8080'
    volumes:
      - /opt/appdata/qbittorrent:/config
      - /mnt/storage/downloads:/downloads
    ports:
      - '8080:8080'
      - '6881:6881'
      - '6881:6881/udp'
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/prowlarr:/config
    ports:
      - '9696:9696'
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/jackett:/config
      - /mnt/storage/downloads:/downloads
    ports:
      - '9117:9117'
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/sonarr:/config
      - /mnt/storage/series:/tv
      - /mnt/storage/downloads:/downloads
    ports:
      - '8989:8989'
    depends_on:
      - qbittorrent
      - prowlarr
      - jackett
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/radarr:/config
      - /mnt/storage/movies:/movies
      - /mnt/storage/downloads:/downloads
    ports:
      - '7878:7878'
    depends_on:
      - qbittorrent
      - prowlarr
      - jackett
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/bazarr:/config
      - /mnt/storage/movies:/movies
      - /mnt/storage/series:/tv
    ports:
      - '6767:6767'
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/jellyfin:/config
      - /mnt/storage/movies:/media/movies
      - /mnt/storage/series:/media/series
      - /mnt/storage/cristaos:/media/cristaos
      - /mnt/storage/Livros:/media/livros
      - /mnt/storage/Audio-livros:/media/Audio-livros
    ports:
      - '8096:8096'
    restart: unless-stopped
    group_add:
      - "993"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: Europe/Madrid
    volumes:
      - /opt/appdata/jellyseerr:/app/config
    ports:
      - '5055:5055'
    depends_on:
      - jellyfin
    restart: unless-stopped

  pelagica:
    image: kartoffelchipss/pelagica:latest
    container_name: pelagica
    environment:
      TZ: Europe/Madrid
    ports:
      - '8097:80'
    volumes:
      - /opt/appdata/pelagica:/config
    depends_on:
      - jellyfin
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    volumes:
      - /opt/appdata/adguard/work:/opt/adguardhome/work
      - /opt/appdata/adguard/conf:/opt/adguardhome/conf
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '3000:3000'
      - '8083:80'
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: '1000:1000'
    volumes:
      - /mnt/storage:/srv
      - /home/thiago/docker/filebrowser/config:/config
      - /home/thiago/docker/filebrowser/database:/database
    ports:
      - '8082:80'
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Madrid
    volumes:
      - /opt/appdata/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

 # homarr:
 #   image: ghcr.io/ajnart/homarr:latest
 #   container_name: homarr
 #   environment:
 #     <<: *common-env
 #   ports:
 #     - '7575:7575'
 #   volumes:
 #     - /opt/appdata/homarr/configs:/app/data/configs
 #     - /opt/appdata/homarr/icons:/app/public/icons
 #     - /opt/appdata/homarr/data:/data
 #     - /var/run/docker.sock:/var/run/docker.sock
 #   restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
      TZ: Europe/Madrid
    ports:
      - '7575:7575'
    volumes:
      - /opt/appdata/homarr-v2:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  glances:
    profiles:
      - monitoring
    image: nicolargo/glances:latest-full
    container_name: glances
    pid: host
    ports:
      - '61208:61208'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      GLANCES_OPT: '-w'
    restart: unless-stopped

  scrutiny:
    profiles:
      - monitoring
    image: ghcr.io/analogj/scrutiny:latest-omnibus
    container_name: scrutiny
    ports:
      - '8081:8080'
      - '8086:8086'
    volumes:
      - /run/udev:/run/udev:ro
      - /opt/appdata/scrutiny/config:/opt/scrutiny/config
      - /opt/appdata/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
    cap_add:
      - SYS_RAWIO
    privileged: true
    restart: unless-stopped

  audiobookshelf:
    profiles:
      - books
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - '13378:80'
    volumes:
      - /mnt/storage/Audio-livros:/audiobooks
      - /mnt/storage/Livros:/books
      - /opt/appdata/audiobookshelf:/config
      - /opt/appdata/audiobookshelf/metadata:/metadata
    restart: unless-stopped

  lazylibrarian:
    profiles:
      - books
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      <<: *common-env
    ports:
      - '5299:5299'
    volumes:
      - /opt/appdata/lazylibrarian:/config
      - /mnt/storage/Livros:/books
      - /mnt/storage/Audio-livros:/audiobooks
      - /mnt/storage/downloads:/downloads
    depends_on:
      - qbittorrent
      - jackett
      - prowlarr
    restart: unless-stopped

  kavita:
    profiles:
      - books
    image: jvmilazz0/kavita:latest
    container_name: kavita
    environment:
      <<: *common-env
    volumes:
      - /opt/appdata/kavita:/kavita/config
      - /mnt/storage/Livros:/books
      - /mnt/storage/mangas:/manga
      - /mnt/storage/hqs:/comics
    ports:
      - '5000:5000'
    restart: unless-stopped

  immich-server:
    profiles:
      - photos
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    volumes:
      - /mnt/storage/photos:/usr/src/app/upload
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: immich
      DB_PASSWORD: immich
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
      IMMICH_HOST: 0.0.0.0
      IMMICH_PORT: '2283'
      TZ: Europe/Madrid
    ports:
      - '2283:2283'
    depends_on:
      - immich_postgres
      - immich_redis
    restart: unless-stopped

  immich_postgres:
    profiles:
      - photos
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immich
      POSTGRES_DB: immich
    volumes:
      - /opt/appdata/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  immich_redis:
    profiles:
      - photos
    image: redis:7-alpine
    container_name: immich_redis
    restart: unless-stopped

  immich-machine-learning:
    profiles:
      - photos
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    volumes:
      - /opt/appdata/immich/model-cache:/cache
    restart: unless-stopped

  flaresolverr:
    profiles:
      - indexers-extra
      - mindexer
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: Europe/Madrid
      LOG_LEVEL: info
    ports:
      - '8191:8191'
    restart: unless-stopped

  # Mindexer: uses the existing FlareSolverr and Prowlarr containers.
  mindexer:
    profiles:
      - mindexer
    build:
      context: ./mindexer/mindexer
      dockerfile: Dockerfile
    container_name: mindexer
    environment:
      TZ: Europe/Madrid
      PORT: '7006'
      REDIS_HOST: mindexer-redis
      REDIS_PORT: '6379'
      FLARESOLVERR_ADDRESS: http://flaresolverr:8191
      FLARESOLVERR_TIMEOUT: '45000'
      FLARESOLVERR_MAX_TIMEOUT: '45000'
      FLARESOLVERR_MAX_SESSIONS: '2'
      FLARESOLVERR_SESSION_TTL: 15m
      LOG_LEVEL: '1'
      LOG_FORMAT: console
    depends_on:
      - mindexer-redis
      - flaresolverr
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mindexer-redis:
    profiles:
      - mindexer
    image: redis:7-alpine
    container_name: mindexer-redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - /opt/appdata/mindexer/redis:/data
    mem_limit: 768m
    restart: unless-stopped

  torrent-indexer:
    profiles:
      - indexers-extra
    image: ghcr.io/felipemarinho97/torrent-indexer:latest
    container_name: torrent-indexer
    environment:
      PORT: '7006'
      REDIS_HOST: torrent_indexer_redis
      REDIS_PORT: '6379'
      FLARESOLVERR_ADDRESS: http://flaresolverr:8191
      FLARESOLVERR_TIMEOUT_SECONDS: '120'
      REQUEST_TIMEOUT_MILLISECONDS: '15000'
    depends_on:
      - torrent_indexer_redis
      - flaresolverr
    ports:
      - '7006:7006'
    restart: unless-stopped

  torrent_indexer_redis:
    profiles:
      - indexers-extra
    image: redis:7-alpine
    container_name: torrent-indexer-redis
    restart: unless-stopped

  series-renamer:
    profiles:
      - tools
    build:
      context: ./rename-series
      dockerfile: Dockerfile
    container_name: series-renamer
    ports:
      - '8085:8085'
    environment:
      APP_DATA_DIR: /config/series-renamer
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ''
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ''
      JELLYFIN_LIBRARY_ID: ''
    volumes:
      - /opt/appdata/jellyfin:/config
      - /mnt/storage/movies:/media/movies
      - /mnt/storage/series:/media/series
      - /mnt/storage/cristaos:/media/cristaos
      - /mnt/storage/Livros:/media/livros
      - /mnt/storage/Audio-livros:/media/Audio-livros
    depends_on:
      - sonarr
      - jellyfin
    restart: unless-stopped

  minio-downloads:
    profiles:
      - tools
    build:
      context: ./minio-downloader
      dockerfile: Dockerfile
    container_name: minio-downloader
    environment:
      TZ: Europe/Madrid
      PORT: '5000'
      WEB_CONCURRENCY: '2'
      DEBUG_FFMPEG: '0'
      DISABLE_VARIANT: '0'
      SAVE_TO_LIBRARY: '1'
      MEDIA_ROOT_SERIES: /media/series
      MEDIA_ROOT_MOVIES: /media/movies
      MEDIA_ROOT_CRISTAO: /media/cristaos
      MEDIA_ROOT_AUDIOLIVROS_INFANTIL: /media/AudioLivros_infantil
    volumes:
      - /mnt/storage/series:/media/series
      - /mnt/storage/movies:/media/movies
      - /mnt/storage/cristaos:/media/cristaos
      - /mnt/storage/AudioLivros_infantil:/media/AudioLivros_infantil
      - /mnt/storage/minio-downloads/logs:/app/logs
    ports:
      - '8090:5000'
    restart: unless-stopped

  # plex:
  #   profiles:
  #     - legacy
  #   image: plexinc/pms-docker:latest
  #   container_name: plex
  #   environment:
  #     TZ: Europe/Madrid
  #     PLEX_UID: '1000'
  #     PLEX_GID: '1000'
  #   volumes:
  #     - /opt/appdata/plex:/config
  #     - /opt/appdata/plex/transcode:/transcode
